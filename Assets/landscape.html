<!DOCTYPE html>
<html lang="en" class="deck-landscape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="__OG_DESCRIPTION__">
<meta property="og:type" content="website">
<meta name="theme-color" content="__THEME_COLOR__">
<link rel="stylesheet" href="__CSS__theme.css">
<link rel="stylesheet" href="__CSS__deck.css">
</head>
<body>
<div class="bar" id="bar"></div>
<a class="flip" href="__FLIP__">Portrait</a>
<nav class="dots" id="dots"></nav>
<a class="site-link" href="__SITE_URL__">__SITE_LABEL__</a>
<div class="stage" id="stage">
__SLIDES__
</div>
<script>
  const stage = document.getElementById("stage");
  const slides = stage.querySelectorAll(".slide");
  const dots = document.getElementById("dots");
  const bar = document.getElementById("bar");
  function go(index) {
    const w = stage.clientWidth || window.innerWidth;
    const next = Math.max(0, Math.min(slides.length - 1, index));
    stage.scrollTo({ left: next * w, behavior: "smooth" });
  }
  slides.forEach((s, i) => {
    const a = document.createElement("a");
    a.href = "#s" + (i + 1);
    a.addEventListener("click", (e) => { e.preventDefault(); go(i); });
    dots.appendChild(a);
  });
  const dotLinks = dots.querySelectorAll("a");
  function update() {
    const w = stage.clientWidth || 1;
    const max = stage.scrollWidth - stage.clientWidth;
    bar.style.width = (max > 0 ? (stage.scrollLeft / max) * 100 : 0) + "%";
    const active = Math.max(0, Math.min(slides.length - 1, Math.round(stage.scrollLeft / w)));
    dotLinks.forEach((d, i) => d.classList.toggle("active", i === active));
  }
  stage.addEventListener("scroll", update, { passive: true });
  window.addEventListener("keydown", (e) => {
    const w = stage.clientWidth || window.innerWidth;
    const current = Math.round(stage.scrollLeft / w);
    if (e.key === "ArrowRight") go(current + 1);
    if (e.key === "ArrowLeft") go(current - 1);
  });
  let pointer = null, originX = 0, originY = 0, horizontal = false;
  stage.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest("a, button")) return;
    pointer = e.pointerId;
    originX = e.clientX;
    originY = e.clientY;
    horizontal = false;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e) => {
    if (e.pointerId !== pointer) return;
    const dx = e.clientX - originX;
    const dy = e.clientY - originY;
    if (!horizontal && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horizontal = Math.abs(dx) > Math.abs(dy);
    if (horizontal) e.preventDefault();
  });
  stage.addEventListener("pointerup", (e) => {
    if (e.pointerId !== pointer) return;
    const dx = e.clientX - originX;
    const dy = e.clientY - originY;
    const w = stage.clientWidth || window.innerWidth;
    const current = Math.round(stage.scrollLeft / w);
    pointer = null;
    if (!horizontal || Math.abs(dx) < 36 || Math.abs(dx) < Math.abs(dy)) return;
    go(current + (dx < 0 ? 1 : -1));
  });
  stage.addEventListener("pointercancel", (e) => { if (e.pointerId === pointer) pointer = null; });
  update();
</script>
</body>
</html>
