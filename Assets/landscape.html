<!DOCTYPE html>
<html lang="en" class="deck-landscape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="__OG_DESCRIPTION__">
<meta property="og:type" content="website">
<meta name="theme-color" content="__THEME_COLOR__">
<link rel="stylesheet" href="__CSS__theme.css">
<link rel="stylesheet" href="__CSS__deck.css">
</head>
<body>
<div class="bar" id="bar"></div>
<a class="flip" href="__FLIP__">Portrait</a>
<nav class="dots" id="dots"></nav>
<a class="site-link" href="__SITE_URL__">__SITE_LABEL__</a>
<div class="stage" id="stage">
<div class="track" id="track">
__SLIDES__
</div>
</div>
<script>
  const stage = document.getElementById("stage");
  const track = document.getElementById("track");
  const slides = Array.from(track.children).filter((el) => el.classList.contains("slide"));
  const dots = document.getElementById("dots");
  const bar = document.getElementById("bar");
  let index = 0;
  let dragging = false;
  let originX = 0;
  let originY = 0;
  let dragX = 0;
  let moved = false;
  function width() { return stage.clientWidth || window.innerWidth; }
  function layoutSlides() {
    const w = width();
    slides.forEach((s) => { s.style.flex = "0 0 " + w + "px"; s.style.width = w + "px"; });
    track.style.width = (w * slides.length) + "px";
  }
  function place(offset, animate) {
    track.style.transition = animate ? "transform 280ms ease" : "none";
    track.style.transform = "translate3d(" + ((-index * width()) + offset) + "px,0,0)";
  }
  function paint() {
    const last = Math.max(1, slides.length - 1);
    bar.style.width = ((index / last) * 100) + "%";
    dotLinks.forEach((d, i) => d.classList.toggle("active", i === index));
  }
  function go(next) {
    index = Math.max(0, Math.min(slides.length - 1, next));
    place(0, true);
    paint();
  }
  slides.forEach((s, i) => {
    const a = document.createElement("a");
    a.href = "#s" + (i + 1);
    a.addEventListener("click", (e) => { e.preventDefault(); go(i); });
    dots.appendChild(a);
  });
  const dotLinks = dots.querySelectorAll("a");
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") go(index + 1);
    if (e.key === "ArrowLeft") go(index - 1);
  });
  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    dragging = true;
    moved = false;
    originX = e.touches[0].clientX;
    originY = e.touches[0].clientY;
    dragX = 0;
    place(0, false);
  }, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (!dragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - originX;
    const dy = e.touches[0].clientY - originY;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    if (Math.abs(dy) > Math.abs(dx)) return;
    e.preventDefault();
    moved = true;
    dragX = dx;
    place(dx, false);
  }, { passive: false, capture: true });
  function finish() {
    if (!dragging) return;
    dragging = false;
    if (dragX <= -36) go(index + 1);
    else if (dragX >= 36) go(index - 1);
    else go(index);
  }
  document.addEventListener("touchend", finish);
  document.addEventListener("touchcancel", finish);
  document.addEventListener("click", (e) => {
    if (!moved) return;
    e.preventDefault();
    e.stopPropagation();
    moved = false;
  }, true);
  stage.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    dragging = true;
    originX = e.clientX;
    dragX = 0;
    place(0, false);
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragging || e.pointerType !== "mouse" || (e.buttons & 1) === 0) return;
    dragX = e.clientX - originX;
    place(dragX, false);
  });
  stage.addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") finish(); });
  window.addEventListener("resize", () => { layoutSlides(); place(0, false); });
  layoutSlides();
  go(0);
</script>
</body>
</html>
