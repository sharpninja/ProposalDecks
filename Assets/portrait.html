<!DOCTYPE html>
<html lang="en" class="deck-portrait">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="__OG_DESCRIPTION__">
<meta property="og:type" content="website">
<meta name="theme-color" content="__THEME_COLOR__">
<link rel="stylesheet" href="__CSS__theme.css">
<link rel="stylesheet" href="__CSS__deck.css">
</head>
<body>
<div class="bar" id="bar"></div>
<a class="flip" href="__FLIP__">Landscape</a>
<nav class="dots" id="dots"></nav>
<a class="site-link" href="__SITE_URL__">__SITE_LABEL__</a>
__SLIDES__
<script>
  const slides = document.querySelectorAll(".slide");
  const dots = document.getElementById("dots");
  const bar = document.getElementById("bar");
  slides.forEach((s, i) => { const a = document.createElement("a"); a.href = "#s" + (i + 1); dots.appendChild(a); });
  const dotLinks = dots.querySelectorAll("a");
  function update() {
    const y = window.scrollY;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (y / h) * 100 : 0) + "%";
    let active = 0;
    slides.forEach((s, i) => { if (s.offsetTop - window.innerHeight / 2 <= y) active = i; });
    dotLinks.forEach((d, i) => d.classList.toggle("active", i === active));
  }
  window.addEventListener("scroll", update, { passive: true });
  update();
</script>
</body>
</html>
